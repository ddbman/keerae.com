<script>

  (function () { var d = new Date(), h = d.getHours() + d.getMinutes() / 60;

<style>

  @font-face { font-family: "Fredoka"; src: url("/fonts/fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
  :root { --plum: #4B3A5A; --cream: #FFF6E5; --ink: var(--plum); }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {

  .bub > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .bub .sq { position: absolute; left: 50%; top: 52%; width: 44%; transform: translate(-50%, -50%) rotate(-8deg); }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-12px) rotate(1.5deg); } }
  h1 {
    margin: 0 0 12px; font: 700 clamp(38px, 7vw, 60px)/1.05 "DynaPuff", "Fredoka", sans-serif; color: var(--cream);
    paint-order: stroke fill; -webkit-text-stroke: .14em var(--plum); letter-spacing: .01em;
  }
  p { margin: 0 0 28px; }
  code { font: 600 .92em "Fredoka", sans-serif; word-break: break-all; }
  a {
    display: inline-flex; align-items: center; gap: .45em; padding: 13px 24px 14px; border-radius: 999px;
    font: 700 21px/1 "DynaPuff", "Fredoka", sans-serif; color: var(--plum); text-decoration: none;
    background: #A6E9C6; border: 3px solid var(--plum);
    box-shadow: 0 5px 0 var(--plum), inset 0 -6px 0 rgba(75, 58, 90, .14), inset 0 4px 0 rgba(255, 255, 255, .55);
    transition: transform .45s cubic-bezier(.34, 1.56, .64, 1);
  }
  a:hover { transform: translateY(-2px) scale(1.04, .97); }
  a:active { transform: translateY(4px) scale(1.1, .86); box-shadow: 0 1px 0 var(--plum); transition-duration: .08s; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }
  @media (prefers-reduced-motion: reduce) { .bub { animation: none; } a { transition: none; } }
</style>
</head>

<script>
